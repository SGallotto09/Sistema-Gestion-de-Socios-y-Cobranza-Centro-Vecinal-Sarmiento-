<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login usuario</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../JS/login.js"></script>
</head>
<body>  
    <div class="contenedor-general-login">
        <div class="contenedor-mensaje">
            <div class="titulo-mensaje">
                <img src="../Image/Logo Vecinal Barrio Sarmiento.png" alt="Logo Centro vecinal Sarmiento">
                <h2>Centro Vecinal Sarmiento</h2>
            </div>

            <div class="texto-mensaje">
                <h3>¡Bienvenido!</h3>
                <p>Por favor, inicie sesión para continuar.</p>
            </div>
        </div>

        <div class="contenedor-form">
            <div class="form">
                <div class="titulo-form">
                    <h2>Iniciar sesión:</h2>
                </div>

                <div class="inputs-form">
                    <div class="input">
                        <h4>Usuario:</h4>
                        <input type="text" placeholder="Ingrese su usuario" id="txtUsuario">
                    </div>

                    <div class="input">
                        <h4>Constraseña:</h4>
                        <input type="text" placeholder="Ingrese su constraseña" id="txtConstrasenia">
                    </div>
                </div>

                <div class="contenedor-boton-sesion">
                    <button id="btnIniciarSesion">Ingresar</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <h4>© Copyright 2026 Sistema de Socios y Cobranzas - Centro vecinal Sarmiento</h4>
        </div>
    </div>
</body>
</html>
